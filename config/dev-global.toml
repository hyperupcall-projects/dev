# Set a filetype to false to skip it.
[format.filetypes]
c = "clang-format"
cmake = "gersemi"
cpp = "clang-format"
css = "prettier"
go = "gofmt"
html = "prettier"
javascript = "prettier"
json = "prettier"
jsonc = "prettier"
latex = "latexindent"
markdown = "prettier"
perl = "perltidy"
python = "ruff"
ruby = "rubyfmt"
rust = "rustfmt"
shell = "shfmt"
toml = "taplo"
typescript = "prettier"
yaml = "yamlfmt"
zig = "zig"
