allowBuilds:
  unrs-resolver: true
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@hyperupcall/scripts-nodejs@0.12.0 || 0.17.0'
  - '@hyperupcall/prettier-config@0.12.0'
  - '@hyperupcall/commitlint-config@0.2.0'
  - '@hyperupcall/markdownlint-config@0.5.2'
  - '@hyperupcall/npm-package-json-lint-config@0.2.0'
publicHoistPattern:
  - prettier
  - 'eslint'
  - '@commitlint/cli'
